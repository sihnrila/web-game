<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쏠픽 웹게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* 숨은 낱말 찾기 D시안과 같은 색 */
  :root{--sp:#004be2;--sp-l:#c3e0ff;--sp-s:#eef6ff;--sp-bg:#f7faff;--ink:#010101;--mute:#6b6b6b}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:var(--sp-bg) url("solpik/cloud-shape.png") center bottom/100% auto fixed no-repeat;-webkit-tap-highlight-color:transparent}
  main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
  header{display:flex;align-items:center;gap:10px}
  header h1{margin:0;padding:6px 16px;border-radius:999px;background:var(--sp-s);color:var(--sp);font-size:22px;font-weight:900}
  .hello{display:flex;align-items:center;gap:8px;margin:18px 0 22px}
  .hello img{width:84px;flex:none;filter:drop-shadow(0 4px 6px rgba(0,40,120,.15))}
  .hello p{position:relative;flex:1;margin:0;padding:12px 16px;border:2px solid var(--sp-l);border-radius:18px;background:#fff;font-size:15px;font-weight:700;line-height:1.45;box-shadow:0 4px 12px rgba(0,75,226,.08)}
  .hello p::before{content:'';position:absolute;left:-9px;top:50%;width:14px;height:14px;background:#fff;border-left:2px solid var(--sp-l);border-bottom:2px solid var(--sp-l);transform:translateY(-50%) rotate(45deg)}
  .list{display:grid;gap:12px}
  a.game{display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px solid var(--sp-l);border-radius:20px;background:#fff;box-shadow:0 4px 0 var(--sp-l);color:var(--ink);text-decoration:none;transition:transform .12s}
  a.game:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sp-l)}
  .tile{flex:none;width:56px;height:56px;display:grid;place-items:center;border:2px solid var(--sp-l);border-radius:14px;background:var(--sp-s);box-shadow:0 3px 0 var(--sp-l);font-size:24px;font-weight:900;color:var(--sp)}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:18px;font-weight:900}
  .txt span{display:block;margin-top:2px;font-size:13px;color:var(--mute);word-break:keep-all}
  .go{flex:none;padding:8px 14px;border-radius:999px;background:var(--sp);color:#fff;font-size:14px;font-weight:700}
  .note{margin-top:22px;text-align:center;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <header><h1>쏠픽 웹게임</h1></header>
  <div class="hello">
    <img src="solpik/blue_guide.png" alt="">
    <p>오늘은 어떤 게임으로 한국어를 연습할까요? 하나를 골라 보세요.</p>
  </div>
  <div class="list">
    <a class="game" href="app/?game=initial&v=097d57c">
      <span class="tile">ㅊㅅ</span>
      <span class="txt"><b>초성탐정</b><span>설명을 보고 초성에 맞는 단어를 골라요</span></span>
      <span class="go">시작</span>
    </a>
    <a class="game" href="app/?game=grammar&v=097d57c">
      <span class="tile">+</span>
      <span class="txt"><b>문법합치기</b><span>빈칸에 알맞은 말을 끌어 놓아 문장을 완성해요</span></span>
      <span class="go">시작</span>
    </a>
    <a class="game" href="app/?game=crossword&v=097d57c">
      <span class="tile">가</span>
      <span class="txt"><b>십자말풀이</b><span>뜻을 보고 가로·세로 칸에 글자를 채워요</span></span>
      <span class="go">시작</span>
    </a>
    <a class="game" href="wordsearch-d.html?v=097d57c">
      <span class="tile">낱</span>
      <span class="txt"><b>숨은 낱말 찾기</b><span>글자판에 숨은 낱말을 드래그해서 찾아요</span></span>
      <span class="go">시작</span>
    </a>
  </div>
  <p class="note">휴대폰 화면 기준입니다.</p>
</main>
</body>
</html>
