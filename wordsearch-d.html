<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>쏠픽 숨은 낱말 찾기 D시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
/* 색은 웹게임 십자말풀이 테마(crossword-theme.css)·공통 상단(wide.css) 값을 그대로 씀 */
:root{--plaque:#f4b944;--title:#986500;--plaque-in:#fff8c4;--plaque-sh:rgba(80,52,17,.4);
 --score-lbl-stroke:#7b3a2d;--score-border:#ad6657;--score-bg:rgba(25,24,32,.69);--cyan:#00cdee;--dark-stroke:#14141c;
 --banner-bg:#2e2331;--banner-line:#ff93c1;--cover-border:#ad744e;--cover-bg:#ff93c1;--cover-in-border:#fdd8e6;--cover-in-bg:#ffabd1;
 --cell-border:#e4d4c2;--cell-bg:#fff;--letter:#4b281d;--step-bg:#f4b944;--step-stroke:#2b1b12;
 --hint-border:#b57024;--hint-bg:#fffef7;--hint-color:#604630;--keys-border:#a0774d;--keys-bg:#fffbef;--key-border:#dfd2b8;--key-bg:#fcf9ec;
 --ok-border:#6bbf55;--ok-bg:#e4f6d8;--no-border:#e05a5a;--no-bg:#ffe3e3;--bg:#1d1622}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Noto Sans KR',sans-serif;color:#fff;background:var(--bg) var(--bgimg) center/cover fixed no-repeat;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
.game{min-height:100%;display:flex;flex-direction:column}
/* 상단: 제목 판 + 점수·시간 */
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
.plaque{flex:none;height:58px;padding:6px;border-radius:12px;background:var(--plaque);box-shadow:0 5px 7px var(--plaque-sh)}
.plaque .in{height:100%;display:flex;align-items:center;gap:6px;padding:0 12px;border:4px solid var(--plaque-in);border-radius:7px}
.plaque img{width:30px;height:30px}
.plaque h1{margin:0;font-size:24px;font-weight:900;color:var(--title);-webkit-text-stroke:.12em #fff;paint-order:stroke fill;white-space:nowrap}
.status{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.score{display:flex;align-items:center;gap:6px}
.stroke{font-family:'Roboto Condensed','Noto Sans KR',sans-serif;font-weight:700;-webkit-text-stroke:.12em var(--dark-stroke);paint-order:stroke fill;white-space:nowrap}
.score .lbl{font-size:20px;-webkit-text-stroke-color:var(--score-lbl-stroke)}
.score .val{min-width:64px;height:30px;display:grid;place-items:center;border:2px solid var(--score-border);background:var(--score-bg);font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:22px;color:#ff0;padding:0 6px}
.score .val.bump{animation:bump .35s}
.timer{display:flex;align-items:center;gap:6px}.timer img{width:22px;height:24px}.timer span{font-size:22px;color:var(--cyan)}
/* 안내 띠 (안내 문구 + 정답·오답 알림) */
.banner{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:6px 12px;border-top:3px solid var(--banner-line);border-bottom:3px solid var(--banner-line);background:var(--banner-bg)}
.banner img{width:24px;height:24px;flex:none}.banner p{margin:0;font-size:16px;font-weight:700;text-align:center;word-break:keep-all}
.banner.good p{color:#9dff7a}.banner.bad p{color:#ff8a8a}
/* 본문 */
.play{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 16px 24px;width:100%;max-width:480px;margin:0 auto}
/* 분홍 수첩 표지 안에 글자판 */
.cover{width:100%;padding:8px;border:4px solid var(--cover-border);border-radius:18px;background:var(--cover-bg);box-shadow:0 6px 8px var(--plaque-sh)}
.cover .in{padding:8px;border:3px solid var(--cover-in-border);border-radius:12px;background:var(--cover-in-bg)}
.bwrap{position:relative;padding:8px;border-radius:8px;background:#fff}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{aspect-ratio:1;display:grid;place-items:center;border:3px solid var(--cell-border);border-radius:10px;background:var(--cell-bg);box-shadow:0 3px 0 var(--cell-border);color:var(--letter);font-size:30px;font-weight:700;transition:transform .12s}
.cell.pop{animation:pop .4s}
.cell.shake{animation:shk .3s;border-color:var(--no-border);background:var(--no-bg)}
.cell.dec{opacity:.35}
.caps,.fx{position:absolute;inset:0;pointer-events:none}
.cap{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));border-radius:999px;border:4px solid var(--c);background:color-mix(in srgb,var(--c) 25%,transparent)}
.cap.new{animation:capin .3s ease-out}
.cap.cur{border-style:solid;background:color-mix(in srgb,var(--c) 35%,transparent)}
.cap.ghost{border-style:dashed;background:transparent}
.float{position:absolute;transform:translate(-50%,-50%);font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:30px;color:#ff0;-webkit-text-stroke:.12em #7b3a2d;paint-order:stroke fill;animation:floatup 1s ease-out forwards;white-space:nowrap}
.float.combo{color:#ff7ad1}
.side{width:100%;display:flex;flex-direction:column;gap:12px}
/* STEP 버튼 모양 (십자말풀이 STEP) */
.steps{display:flex;gap:10px}
.step{flex:1;height:44px;display:grid;place-items:center;border:3px solid #ff0;border-radius:10px;background:var(--step-bg);box-shadow:0 4px 6px var(--plaque-sh);color:#fff;font-size:17px;font-weight:700;-webkit-text-stroke:.12em var(--step-stroke);paint-order:stroke fill}
.step:active{transform:translateY(2px)}
.step.on{background:#ff9f2e}
/* 낱말 목록: 십자말풀이 글자판(keys) 모양 */
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;border:4px solid var(--keys-border);border-radius:12px;background:var(--keys-bg);box-shadow:0 6px 8px var(--plaque-sh)}
.keys.mean{grid-template-columns:1fr}
.word{position:relative;min-height:44px;padding:6px 8px;border:3px solid var(--key-border);border-radius:12px;background:var(--key-bg);color:var(--letter);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.word .w{font-size:19px;font-weight:700}
.word .m{font-size:12px;color:var(--hint-color);line-height:1.4}
.word.done{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,#fff);cursor:pointer}
.word.done .w{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--c)}
.word.done::after{content:'✓';position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center}
/* 해설 상자 (십자말풀이 힌트 상자) */
.hint{min-height:84px;padding:12px 14px;border:4px solid var(--hint-border);background:var(--hint-bg);color:var(--hint-color);font-size:15px;line-height:1.55}
.hint .empty{color:#a8957f;text-align:center;margin:14px 0}
.hint .hd2{display:flex;align-items:center;gap:8px;margin-bottom:4px}.hint .hw{font-size:22px;font-weight:900;color:var(--c,#986500)}
.hint .say{border:2px solid var(--key-border);background:#fff;border-radius:999px;padding:3px 10px;font-size:13px;color:var(--letter)}
.hint .ln{margin-top:4px}.hint .lb{display:inline-block;margin-right:6px;padding:0 6px;border-radius:6px;background:#f6e3c4;font-size:12px;font-weight:700;color:#b57024;vertical-align:1px}.hint .en{font-size:13px;color:#9a8670}
.hint mark{background:color-mix(in srgb,var(--c,#f4b944) 35%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.hint.pop{animation:pop .35s}
.tools{display:flex;gap:8px}
.tool{flex:1;height:40px;border:3px solid var(--key-border);border-radius:12px;background:var(--key-bg);color:var(--letter);font-size:14px;font-weight:700;box-shadow:0 3px 0 var(--key-border)}
.tool:active{transform:translateY(2px);box-shadow:none}
.note{max-width:960px;margin:0 auto;padding:0 16px 20px;font-size:12px;line-height:1.5;color:#fff;opacity:.85;text-shadow:0 1px 2px #000}
/* READY / START */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,14,24,.55);z-index:50}
.overlay[hidden]{display:none}
.ready{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:84px;color:#ffd84a;-webkit-text-stroke:.1em #7b3a2d;paint-order:stroke fill;animation:zoomin .5s}
/* 결과 팝업 */
.popup{width:min(360px,88vw);padding:18px;border:4px solid var(--hint-border);border-radius:20px;background:var(--hint-bg);color:var(--hint-color);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:zoomin .35s}
.popup .ptitle{display:inline-block;margin:-38px 0 8px;padding:8px 26px;border:4px solid var(--plaque-in);border-radius:12px;background:var(--plaque);font-size:24px;font-weight:900;color:var(--title);-webkit-text-stroke:.12em #fff;paint-order:stroke fill}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0}.stars i{font-style:normal;color:#d8cbb6}.stars i.on{color:#ffc61a;text-shadow:0 2px 0 #c98a00;display:inline-block;animation:pop .5s backwards}
.rows{margin:8px 0 12px;font-size:15px}.rows div{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px dashed #e4d4c2}.rows b{color:var(--letter)}
.xp{font-family:'Roboto Condensed',sans-serif;font-size:40px;color:#ff9f2e;-webkit-text-stroke:.08em #7b3a2d;paint-order:stroke fill;margin:4px 0}
.popup .btns{display:flex;gap:8px;margin-top:10px}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes bump{40%{transform:scale(1.25)}}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes capin{from{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(.6);opacity:0}to{transform:translate(-50%,-50%) rotate(var(--rot,0deg));opacity:1}}
@keyframes floatup{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-60px}}
@keyframes zoomin{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* PC (웹게임 1440×900 시안 배치: 제목 왼쪽, 점수·시간 오른쪽 / 판 왼쪽, 목록·해설 오른쪽) */
@media (min-width:900px){
 .hd{padding:28px 64px 20px}
 .plaque{height:96px;padding:10px;border-radius:14px}.plaque .in{border-width:5px;gap:14px;padding:0 40px}.plaque img{width:48px;height:48px}.plaque h1{font-size:44px}
 .status{flex-direction:row;align-items:center;gap:32px}.score .lbl{font-size:32px}.score .val{min-width:112px;height:44px;font-size:34px}.timer img{width:44px;height:48px}.timer span{font-size:40px}
 .banner{min-height:72px}.banner img{width:36px;height:36px}.banner p{font-size:26px}
 .play{flex-direction:row;align-items:flex-start;justify-content:center;gap:64px;max-width:1300px;padding:36px 64px}
 .cover{width:520px;flex:none}.cell{font-size:44px;border-radius:14px}.board{gap:10px}
 .side{width:560px;gap:18px}.steps .step{height:52px;font-size:22px}
 .word{min-height:60px}.word .w{font-size:24px}.word .m{font-size:14px}.keys{gap:12px;padding:12px}
 .hint{min-height:150px;font-size:18px;padding:16px 20px}.hint .hw{font-size:28px}
 .tool{height:50px;font-size:17px}
}

.tool.on{background:#ffe7c2}
/* 모바일: 한 화면에 다 보이게 — 고정 부분 높이를 줄이고, 글자판은 남은 높이에 맞춰 크기를 정함 */
@media (max-width:899px){
 .game{min-height:100dvh}
 .hd{padding:8px 12px}.plaque{height:46px;padding:4px}.plaque .in{border-width:3px;padding:0 10px;gap:5px}.plaque img{width:24px;height:24px}.plaque h1{font-size:20px}
 .status{gap:2px}.score .lbl{font-size:16px}.score .val{min-width:54px;height:24px;font-size:18px}.timer img{width:18px;height:20px}.timer span{font-size:18px}
 .banner{min-height:38px;padding:4px 10px;border-width:2px}.banner img{width:18px;height:18px}.banner p{font-size:14px}
 .play{gap:8px;padding:8px 12px}
 .cover{width:min(100%,calc(100dvh - 372px));min-width:230px;padding:5px;border-width:3px;border-radius:14px}.cover .in{padding:5px;border-width:2px}.bwrap{padding:5px}
 .board{gap:4px}.cell{border-width:2px;border-radius:8px;box-shadow:0 2px 0 var(--cell-border);font-size:clamp(18px,7vw,28px)}
 .steps{display:none}
 .keys{grid-template-columns:repeat(5,1fr);gap:4px;padding:5px;border-width:3px}.keys.mean{grid-template-columns:1fr}
 .word{min-height:36px;padding:3px 2px;border-width:2px;border-radius:9px}.word .w{font-size:14px;word-break:keep-all}
 .word.done::after{width:16px;height:16px;font-size:10px;top:-6px;right:-4px}
 .hint{min-height:0;height:124px;overflow-y:auto;padding:8px 10px;border-width:3px;font-size:13.5px;line-height:1.45}
 .hint .empty{margin:36px 0}.hint .hw{font-size:18px}.hint .say{padding:1px 8px;font-size:12px}.hint .en{font-size:12px}
 .tools{gap:6px}.tool{height:36px;font-size:12.5px;border-width:2px;border-radius:10px;padding:0 2px}
 .note{display:none}
}
@media (min-width:900px){.m-only{display:none}}

/* ───── 쏠픽 테마 (solpik.kr 색·캐릭터) ───── */
:root{--sp:#004be2;--sp-l:#c3e0ff;--sp-s:#eef6ff;--sp-bg:#f7faff;--ink:#010101;--mute:#6b6b6b;--line:#e7e7e7;--ok:#4dac27;--no:#d4183d;--warn:#ffc300}
body{background:var(--sp-bg) url("solpik/cloud-shape.png") center bottom/100% auto fixed no-repeat;color:var(--ink)}
.stroke{-webkit-text-stroke:0}
.plaque{background:none;box-shadow:none;height:auto;padding:0}.plaque .in{border:0;padding:0;gap:10px}
#i-mag,#i-mag2,#i-watch{display:none}
.plaque .logo{height:30px;width:auto}
.plaque h1{color:var(--sp);-webkit-text-stroke:0;font-weight:900;font-size:22px;padding:4px 14px;border-radius:999px;background:var(--sp-s)}
.score .lbl{color:var(--mute);font-size:14px;-webkit-text-stroke:0;font-family:'Noto Sans KR';font-weight:700}
.score .val{min-width:70px;height:32px;border:0;border-radius:999px;background:var(--sp);color:#fff;font-size:20px}
.timer span{color:var(--sp);font-size:20px;-webkit-text-stroke:0}.timer span::before{content:'⏱ ';font-size:.85em}
/* 말풍선 + 캐릭터 */
.banner{position:relative;border:0;background:none;min-height:64px;justify-content:flex-start;gap:6px;max-width:1300px;width:100%;margin:0 auto;padding:4px 16px}
.banner .mascot{width:72px;height:auto;flex:none;filter:drop-shadow(0 4px 6px rgba(0,40,120,.15));transform-origin:50% 100%}
.mascot.good{animation:hop .6s}.mascot.bad{animation:nope .5s}
canvas.mascot{aspect-ratio:1/1;filter:none}canvas.mascot.good,canvas.mascot.bad{animation:none}
.banner p{position:relative;flex:1;color:var(--ink);background:#fff;border:2px solid var(--sp-l);border-radius:18px;padding:10px 16px;font-size:15px;text-align:left;box-shadow:0 4px 12px rgba(0,75,226,.08)}
.banner p::before{content:'';position:absolute;left:-9px;top:50%;width:14px;height:14px;background:#fff;border-left:2px solid var(--sp-l);border-bottom:2px solid var(--sp-l);transform:translateY(-50%) rotate(45deg)}
.banner.good p{color:var(--ok);border-color:#b9e3a5}.banner.good p::before{border-color:#b9e3a5}
.banner.bad p{color:var(--no);border-color:#f6b6c2}.banner.bad p::before{border-color:#f6b6c2}
/* 글자판 */
.cover{padding:10px;border:0;border-radius:24px;background:#fff;box-shadow:0 10px 30px rgba(0,75,226,.12)}
.cover .in{padding:0;border:0;background:none}.bwrap{padding:0;background:none}
.cell{border:2px solid var(--sp-l);background:var(--sp-s);box-shadow:0 3px 0 var(--sp-l);color:var(--ink);border-radius:14px}
.cell.shake{border-color:var(--no);background:#ffe9ed}
.cap{border-width:4px}
.float{color:var(--sp);-webkit-text-stroke:.1em #fff}.float.combo{color:#ff8a1f}
/* 오른쪽 */
.step{border:0;border-radius:999px;background:var(--sp);color:#fff;-webkit-text-stroke:0;box-shadow:0 6px 14px rgba(0,75,226,.25)}
#prog{background:#fff;color:var(--sp);border:2px solid var(--sp-l);box-shadow:none}
.step.on{background:#1e3a72}
.keys{border:0;border-radius:20px;background:#fff;box-shadow:0 6px 20px rgba(0,75,226,.08)}
.word{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px}
.word.done{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff)}
.hint{border:0;border-radius:20px;background:#fff;color:var(--ink);box-shadow:0 6px 20px rgba(0,75,226,.08)}
.hint .empty{color:var(--mute)}.hint .lb{background:var(--sp-s);color:var(--sp)}.hint .en{color:var(--mute)}.hint .say{border-color:var(--sp-l);color:var(--sp)}
.tool{border:2px solid var(--sp-l);background:#fff;color:var(--sp);box-shadow:none;border-radius:999px}
.tool.on{background:var(--sp-s)}
#next{background:var(--sp);border-color:var(--sp);color:#fff}
.note{color:var(--mute);text-shadow:none}
/* READY / START */
.overlay{background:rgba(247,250,255,.85)}
.rbox{display:flex;align-items:flex-end;gap:10px}.rc{width:min(26vw,180px);height:auto;animation:zoomin .45s}.rc.r{animation-delay:.1s}
.ready{color:var(--sp);-webkit-text-stroke:.08em #fff;font-family:'Noto Sans KR';font-weight:900;font-size:64px;margin-bottom:30px}
/* 결과 */
.popup{border:0;border-radius:28px;background:#fff;color:var(--ink);box-shadow:0 20px 50px rgba(0,75,226,.2);padding-top:10px}
.pchar{width:150px;margin:-90px auto 0;display:block;animation:hop .8s .2s}
.popup .ptitle{margin:0 0 4px;padding:0;border:0;background:none;color:var(--sp);-webkit-text-stroke:0;font-size:26px}
.stars i.on{color:var(--warn);text-shadow:0 2px 0 #d9a400}
.xp{color:var(--sp);-webkit-text-stroke:0;font-family:'Noto Sans KR';font-weight:900}
.rows div{border-bottom:1px solid var(--line)}.rows b{color:var(--ink)}
.popup .step{height:44px}
@keyframes hop{0%,100%{transform:none}30%{transform:translateY(-14px) scale(1.06,.95)}60%{transform:translateY(0) scale(.96,1.05)}}
@keyframes nope{20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@media (min-width:900px){
 .plaque .logo{height:40px}.plaque h1{font-size:30px;padding:6px 20px}
 .score .lbl{font-size:18px}.score .val{min-width:100px;height:44px;font-size:28px}.timer span{font-size:30px}
 .banner{padding:8px 64px}.banner .mascot{width:110px}.banner p{font-size:22px;padding:14px 22px}
 .cell{font-size:42px}
}

 .plaque .logo{height:20px}.plaque h1{font-size:16px;padding:3px 10px}
 .score .lbl{font-size:12px}.score .val{min-width:52px;height:24px;font-size:16px}.timer span{font-size:15px}
 .banner{min-height:52px;padding:0 12px}.banner .mascot{width:58px}.banner p{font-size:13.5px;padding:7px 12px;border-radius:14px}
 .cover{width:min(100%,calc(100dvh - 386px));padding:6px;border-radius:18px}
 .cell{border-radius:10px}
 .ready{font-size:44px}
}
.lv{margin-left:6px;border:2px solid var(--sp-l);border-radius:999px;background:#fff;color:var(--sp);font:700 13px 'Noto Sans KR';padding:4px 8px}
@media (min-width:900px){.lv{font-size:16px;padding:6px 12px}}

ccident between a car or train crashing into another vehicle or with a pedestrian.", "ex": "졸음으로 인한 교통사고의 발생률이 높아지고 있다.", "dir": "right", "cells": [[1, 0], [1, 1], [1, 2], [1, 3]]}, {"text": "데려가다", "word_id": "L2_00000261", "kr": "자기를 따라오게 하여 함께 가다.", "en": "To make someone follow one, and thus go with him/her.", "ex": "유민이는 아이를 맡길 곳이 없어 아이를 동창 모임에 데려갔다.", "dir": "right", "cells": [[4, 1], [4, 2], [4, 3], [4, 4]]}, {"text": "파랗다", "word_id": "L2_00001046", "kr": "맑은 가을 하늘이나 깊은 바다와 같이 밝고 선명하게 푸르다.", "en": "A color being brightly and vividly blue like that of a clear fall sky or deep sea.", "ex": "눈앞에 펼쳐진 바다는 온통 파랬다.", "dir": "up", "cells": [[4, 0], [3, 0], [2, 0]]}, {"text": "풀다", "word_id": "L2_00001058", "kr": "매이거나 묶이거나 얽힌 것을 원래의 상태로 되게 하다.", "en": "To return what has been tied, bound, or twisted back to its original state.", "ex": "나는 새장에 갇힌 새를 풀어 하늘로 날려 보냈다.", "dir": "left", "cells": [[2, 1], [2, 0]]}, {"text": "학교", "word_id": "L1_00000787", "kr": "일정한 목적, 교과 과정, 제도 등에 따라 학생을 교육하는 기관.", "en": "An institution that educates students according to a specific purpose, curriculum, system, etc.", "ex": "내년에 딸이 여덟 살이 되어 학교에 입학할 것이다.", "dir": "left", "cells": [[3, 2], [3, 1]]}]}, {"board_id": "LV1_WORD_SEARCH_00471", "size": 5, "grid": [["붙", "이", "다", "백", "대"], ["이", "히", "럼", "학", "려"], ["불", "퇴", "근", "임", "로"], ["난", "백", "화", "점", "울"], ["데", "품", "져", "천", "운"]], "words": [{"text": "대학", "word_id": "L1_00000175", "kr": "고등학교를 마치고 진학하는 고등 교육 기관.", "en": "A tertiary educational institution high school graduates go to.", "ex": "영문학과와 국문학과는 문과 대학에 속해 있다.", "dir": "down_left", "cells": [[0, 4], [1, 3]]}, {"text": "백화점", "word_id": "L1_00000301", "kr": "한 건물 안에 온갖 상품을 종류에 따라 나누어 벌여 놓고 판매하는 큰 상점.", "en": "A large retail store divided into departments selling a great many kinds of goods in one building.", "ex": "영수는 선생님께 드릴 선물을 사러 고급 백화점을 갔다.", "dir": "right", "cells": [[3, 1], [3, 2], [3, 3]]}, {"text": "붙이다", "word_id": "L2_00000468", "kr": "무엇에 닿아서 떨어지지 않게 하다.", "en" ], [2, 2]]}, {"text": "생겨나다", "word_id": "L4_00001088", "kr": "없던 것이 있게 되다.", "en": "For something that did not exist to emerge.", "ex": "사람들이 사회생활을 하는 과정에서 생겨나는 일들을 사회 현상이라 한다.", "dir": "left", "cells": [[3, 4], [3, 3], [3, 2], [3, 1]]}, {"text": "실감", "word_id": "L4_00001271", "kr": "실제로 겪고 있다는 느낌.", "en": "A feeling that one seems to actually experience it.", "ex": "그 화가는 실감이 나게 그림을 그린다.", "dir": "up", "cells": [[1, 0], [0, 0]]}]}, {"board_id": "LV3_WORD_SEARCH_00480", "size": 5, "grid": [["격", "근", "장", "생", "거"], ["래", "족", "행", "드", "지"], ["리", "화", "비", "였", "결"], ["무", "후", "요", "새", "자"], ["마", "된", "스", "야", "토"]], "words": [{"text": "거지", "word_id": "L4_00000082", "kr": "다른 사람에게 돈이나 음식 등을 달라고 빌어서 얻어먹고 사는 사람.", "en": "A person who lives by begging others for money, food, etc.", "ex": "길거리의 거지는 사람들을 쫓아다니며 동냥을 하고 있었다.", "dir": "down", "cells": [[0, 4], [1, 4]]}, {"text": "근래", "word_id": "L4_00000263", "kr": "가까운 요즈음.", "en": "The days or years near the present.", "ex": "민준이는 근래에 보기 드물게 마음씨가 고운 사람이다.", "dir": "down_left", "cells": [[0, 1], [1, 0]]}, {"text": "마무리", "word_id": "L4_00000660", "kr": "일을 끝냄.", "en": "The act of finishing a task.", "ex": "큰 명절을 맞아 어머니는 마무리 음식 준비로 바쁘시다.", "dir": "up", "cells": [[4, 0], [3, 0], [2, 0]]}, {"text": "비행장", "word_id": "L3_00000709", "kr": "비행기들이 뜨고 내리고 머물 수 있도록 여러 시설을 갖추어 놓은 장소.", "en": "A place equipped with a variety of facilities to enable planes to take off, land, and stay.", "ex": "나는 간단하게 여행 가방을 꾸리고 비행장으로 향했다.", "dir": "up", "cells": [[2, 2], [1, 2], [0, 2]]}, {"text": "요새", "word_id": "L4_00001490", "kr": "얼마 전부터 이제까지의 매우 짧은 동안.", "en": "An abbreviated word for these days, meaning an extremely short period from a while ago to the present.", "ex": "요새 사춘기 아들의 키가 부쩍 컸다.", "dir": "right", "cells": [[3, 2], [3, 3]]}]}, {"board_id": "LV3_WORD_SEARCH_00393", "size": 5, "grid": [["입", "갈", "객", "쪽", "셨"], ["감", "관", "름", "한", "회"], ["따", "급", "손", "씨", "호"], ["었", "가", "꾸", "다", "동"], ["받", "객", "와", "석", "야"]], "words "먹", "점"], ["정", "어", "교", "침", "다"]], "words": [{"text": "감독", "word_id": "L3_00000030", "kr": "일이나 사람이 잘못되지 않도록 살피고 단속함.", "en": "The act of monitoring and controlling things or people so that nothing goes wrong.", "ex": "직원들의 근무 태도 감독이 철저하게 이루어졌다.", "dir": "down_left", "cells": [[0, 4], [1, 3]]}, {"text": "용어", "word_id": "L4_00001503", "kr": "어떤 분야에서 전문적으로 사용하는 말.", "en": "A word specially used in a certain field.", "ex": "나는 보고서에 정확한 용어를 쓰기 위해 사전을 찾았다.", "dir": "down_left", "cells": [[3, 2], [4, 1]]}, {"text": "잡아먹다", "word_id": "L3_00001298", "kr": "동물을 죽여서 먹다.", "en": "To kill and eat an animal.", "ex": "작은 집에 큰 에어컨을 들여놓으면 쓸데없이 전기세만 잡아먹는다.", "dir": "down_right", "cells": [[1, 1], [2, 2], [3, 3], [4, 4]]}, {"text": "점원", "word_id": "L3_00001362", "kr": "상점에서 돈을 받고 일하는 사람.", "en": "A person who is paid to work at a store.", "ex": "빵집 점원으로 일하는 승규는 모든 종류의 빵 이름을 외우고 있다.", "dir": "up", "cells": [[3, 4], [2, 4]]}, {"text": "짝수", "word_id": "L4_00001933", "kr": "2로 나누어서 나머지가 0이 되는 수.", "en": "An integer that is evenly divisible by 2 without remainder.", "ex": "우리 회사는 자동차 번호 끝자리가 홀수인지 짝수인지에 따라 운행을 제한했다.", "dir": "up", "cells": [[2, 0], [1, 0]]}]}, {"board_id": "LV3_WORD_SEARCH_00088", "size": 5, "grid": [["다", "피", "살", "스", "백"], ["던", "야", "져", "장", "님"], ["근", "투", "들", "사", "나"], ["말", "관", "느", "걸", "통"], ["독", "제", "역", "말", "병"]], "words": [{"text": "말투", "word_id": "L4_00000683", "kr": "말을 하는 버릇이나 형식.", "en": "One's habit or manner of speaking.", "ex": "선생님이 질문하자 학생이 공손한 말투로 대답했다.", "dir": "up_right", "cells": [[3, 0], [2, 1]]}, {"text": "살피다", "word_id": "L3_00000760", "kr": "이것저것 조심하여 자세히 보다.", "en": "To examine thoroughly.", "ex": "경비원은 건물 내부를 천천히 살피고 있었다.", "dir": "left", "cells": [[0, 2], [0, 1], [0, 0]]}, {"text": "스님", "word_id": "L4_00001220", "kr": "부처의 가르침을 수행하는 승려가 자기 스승을 이르는 말.", "en": "A term used by a monk following the Buddha's teachings to address his master.", "ex": "나는 절에 잠시 머무르는 동안 스님에게 많은 가르침을 받았다.", "dir": "down_right", "cells": [[0, 3], [1, 4]]}, {"text": "야근", "word_id": "L3_00001011", "kr": "퇴근 시간이 지나 밤늦게까지 하는 일.", "en": "An act of working overtime till late at night.", "ex": "나는 계속되는 야근으로 체력이 바닥난 상태였다.", "dir": "down_left", "cells": [[1, 1], [2, 0]]}, {"text": "장사", "word_id": "L4_00001729", "kr": "이익을 얻으려고 물건을 사서 팖. 또는 그런 일.", "en": "The act of buying products to sell for profit, or such business.", "ex": "트럭으로 생선 장사를 하던 승규는 돈을 금세 모아 가게를 내었다.", "dir": "down", "cells": [[1, 3], [2, 3]]}]}, {"board_id": "LV3_WORD_SEARCH_00617", "size": 5, "grid": [["지", "종", "님", "판", "했"], ["창", "다", "호", "재", "본"], ["급", "더", "그", "삶", "왕"], ["며", "행", "부", "다", "복"], ["위", "제", "았", "루", "관"]], "words": [{"text": "그다지", "word_id": "L4_00000242", "kr": "대단한 정도로는. 또는 그렇게까지는.", "en": "Not to a great degree, or not that much.", "ex": "나는 그다지 배가 고프지 않아서 점심을 좀 늦게 먹었다.", "dir": "up_left", "cells": [[2, 2], [1, 1], [0, 0]]}, {"text": "삶다", "word_id": "L3_00000762", "kr": "물에 넣고 끓이다.", "en": "To put in water and boil.", "ex": "날씨가 푹푹 삶아서 조금만 걸어도 지친다.", "dir": "down", "cells": [[2, 3], [3, 3]]}, {"text": "왕복", "word_id": "L3_00001135", "kr": "갔다가 돌아옴.", "en": "The act of going and returning.", "ex": "고속 열차를 타면 서울에서 부산까지 왕복으로 여섯 시간도 안 걸린다.", "dir": "down", "cells": [[2, 4], [3, 4]]}, {"text": "재판", "word_id": "L4_00001744", "kr": "한 번 출판했던 책을 다시 출판함. 또는 그렇게 출판한 책.", "en": "The act of publishing again a book that has already been published, or a book published that way.", "ex": "출판사는 베스트셀러가 된 책의 재판을 진행했다.", "dir": "up", "cells": [[1, 3], [0, 3]]}, {"text": "행위", "word_id": "L4_00002196", "kr": "사람이 의지를 가지고 하는 짓.", "en": "An act done with an intention or will.", "ex": "선생님은 학교 안에서 폭력 행위를 한 학생들을 엄중하게 처벌하였다.", "dir": "down_left", "cells": [[3, 1], [4, 0]]}]}, {"board_id": "LV3_WORD_SEARCH_00064", "size": 5, "grid": [["몸", "친", "신", "알", "여"], ["짓", "업", "함", "유", "마"], ["히", "실", "롭", "절", "먹"], ["긁", "다", "족", "책", "포"], ["았", "유", "창", "하", "다"]], "words": [{"text": "긁다", "word_id": "L4_00000269", "kr": "손톱이나 뾰족한 물건으로 문지르다. function cellEl(p){return boardEl.children[p[0]*N+p[1]]}
function nearest(x,y){let best=null,bd=1e9;for(const e of boardEl.children){const r=e.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,d=(cx-x)**2+(cy-y)**2;if(d<bd){bd=d;best=e}}return best&&[+best.dataset.r,+best.dataset.c]}
// 8방향 드래그: 시작 칸 중심에서 손가락까지의 각도를 45° 단위로 맞추고(가로·세로·대각선, 거꾸로 포함),
// 그 방향 칸 간격으로 몇 칸 갔는지 센다. 판 밖으로 나가는 칸은 자른다

 const pitch=N>1?center([0,1])[0]-center([0,0])[0]:1;if(Math.hypot(dx,dy)<pitch*.35)return out;

  msg(combo?`콤보! ${w.text} 찾았어요!`:`정답! ${w.text} 찾았어요!`,'good');sfx('correct');setTimeout(()=>speak(w.text),350);explain(w);
  if(found.size===B.words.length){const g=gameNo;setTimeout(()=>{if(g===gameNo)finish()},900)}return}
 drawCaps();

 wrong++;sfx('wrong');cells.forEach(p=>{const c=cellEl(p);c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),350)});msg('목록에 없는 낱말이에요. 다시 찾아보세요!','bad')}
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function mark(ex,word){const e=esc(ex);let k=e.indexOf(word),len=word.length;
 if(k<0&&word.endsWith('다')&&word.length>2){const st=word.slice(0,-1);k=e.indexOf(st);len=st.length+(k>=0&&e[k+st.length]&&/[가-힣]/.test(e[k+st.length])?1:0)}
 return k<0?e:e.slice(0,k)+'<mark>'+e.slice(k,k+len)+'</mark>'+e.slice(k+len)}

 el.innerHTML=`<div class="hd2"><span class="hw">${w.text}</span><button class="say" id="say1">🔊 낱말</button><button class="say" id="say2">🔊 예문</button></div>

 el.classList.remove('pop');el.offsetWidth;el.classList.add('pop');const bd=$('#buddy');bd.classList.remove('good');bd.offsetWidth;bd.classList.add('good');
 $('#say1').onclick=()=>speak(w.text);$('#say2').onclick=()=>speak(w.ex||w.text)}

 [...boardEl.children].forEach(c=>{if(!B.words.some(w=>w.cells.some(p=>cellEl(p)===c)))c.classList.add('dec')});
 // 별: 틀린 시도 0번이면 3개, 2번 이하면 2개, 그 외 1개 (XP와 무관한 연출)
 const st=wrong===0?3:wrong<=2?2:1;
 $('#stars').innerHTML=[1,2,3].map(i=>`<i class="${i<=st?'on':''}" style="animation-delay:${.25+i*.18}s">★</i>`).join('');
 $('#rScore').textContent=score;$('#rTime').textContent=fmt(t);$('#rWrong').textContent=wrong+'회';
 $('#result').hidden=false;sfx('success');confetti();msg('모두 찾았어요! 🎉','good')}
function confetti(){const cs=['#f59e0b','#10b981','#3b82f6','#ec4899','#8b5cf6','#ffd84a'];for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';
 d.style.left=Math.random()*100+'vw';d.style.background=cs[i%cs.length];d.style.animationDuration=2+Math.random()*2+'s';d.style.animationDelay=Math.random()*.6+'s';
 document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}}

<script type="module">
// 파랑이 Rigby2D 애니메이션(대기/정답/오답). WebGL이 안 되면 기존 PNG 그대로 둔다.
import { parseAtlas } from './solpik/rigby/runtime/core/atlas.js';
import { readSkeletonJson } from './solpik/rigby/runtime/core/interop.js';
import { Pose } from './solpik/rigby/runtime/core/pose.js';
import { AnimationState } from './solpik/rigby/runtime/core/state.js';
import { WebGLRenderer } from './solpik/rigby/runtime/webgl/renderer.js';
const BASE='./solpik/rigby/blue_guide/',cv=document.getElementById('mascotCv');
try{
 const gl=cv.getContext('webgl2',{premultipliedAlpha:true,alpha:true})??cv.getContext('webgl',{premultipliedAlpha:true,alpha:true});
 if(!gl)throw new Error('no webgl');
 const [json,atlasText,page]=await Promise.all([fetch(BASE+'blue_guide.json').then(r=>r.json()),fetch(BASE+'blue_guide.atlas').then(r=>r.text()),
  fetch(BASE+'blue_guide.png').then(r=>r.blob()).then(b=>createImageBitmap(b,{premultiplyAlpha:'none'}))]);
 const renderer=new WebGLRenderer(gl),sk=readSkeletonJson(json,'blue_guide').skeleton;
 const textures=renderer.atlasTextures(parseAtlas(atlasText),new Map([['blue_guide.png',page]]));
 const pose=new Pose(sk),state=new AnimationState();state.play(sk,'idle',true,0);
 cv.hidden=false;document.getElementById('mascot').hidden=true;
 let last=performance.now();
 const frame=now=>{const dt=Math.min(.1,(now-last)/1000);last=now;const dpr=devicePixelRatio||1,w=Math.round(cv.clientWidth*dpr),h=Math.round(cv.clientHeight*dpr);
  if(w&&h){if(cv.width!==w||cv.height!==h)[cv.width,cv.height]=[w,h];gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
   state.update(sk,dt);state.apply(sk,pose);renderer.begin(w,h,{x:0,y:262,zoom:Math.min(w,h)/600});renderer.drawSkeleton(sk,pose,textures);renderer.end()}
  requestAnimationFrame(frame)};
 requestAnimationFrame(frame);
 window.blueMascot={play(name){state.setAnimation(sk,0,name,false,.1);state.addAnimation(sk,0,'idle',true,.25)},state,sk};
}catch(e){console.warn('blueMascot',e)}
</script></body></html>
